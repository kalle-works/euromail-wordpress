name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS
    runs-on: kalle-works-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Lint PHP syntax
        run: find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPCS
        run: composer run lint

  test:
    name: PHPUnit
    runs-on: kalle-works-arm64
    env:
      # wp-env's default cache directory (~/.wp-env, the runner's HOME) is
      # not visible to the Docker daemon that actually runs its containers
      # on this runner — confirmed by direct inspection: the WordPress-develop
      # PHPUnit library wp-env downloads there is genuinely present on the
      # runner's own filesystem (a real git checkout, correctly sparse-checked
      # out to the right tag) but appears completely empty from inside the
      # container, which then fails to find WP_UnitTestCase et al. The
      # plugin directory itself, mounted from inside $GITHUB_WORKSPACE, does
      # NOT have this problem — the runner's job-workspace sharing with the
      # Docker daemon covers that path specifically. Redirecting wp-env's
      # whole cache directory into the workspace puts it under that same
      # sharing mechanism. (Locally this env var is unset, so nothing about
      # normal local development changes — wp-env just uses its own default
      # ~/.wp-env, which works fine there since the daemon is native.)
      WP_ENV_HOME: ${{ github.workspace }}/.wp-env-home
    steps:
      - name: Check Docker availability
        # wp-env needs a Docker daemon; the runner naming (kalle-works-arm64)
        # suggests these may be Kubernetes-hosted, where that's not a given.
        # Fail here with a clear message rather than several minutes into a
        # cryptic wp-env timeout below.
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::'docker info' failed — no Docker daemon available on this runner. wp-env (and therefore this whole job) needs Docker. If this runner is Kubernetes-hosted, it needs Docker-in-Docker or a Docker socket mounted before this job can run at all."
            exit 1
          fi
          echo "Docker is available: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'version unknown')"
          if ! docker compose version > /dev/null 2>&1; then
            echo "::error::'docker compose version' failed — the Docker daemon is reachable, but the Compose v2 plugin isn't. wp-env (@wordpress/env ^11) requires 'docker compose', not the old standalone 'docker-compose' binary. Install the compose-plugin package on this runner (e.g. 'docker-compose-plugin' via apt, or the Docker Desktop/Colima setting that enables it) before this job can run."
            exit 1
          fi
          echo "Docker Compose is available: $(docker compose version --short 2>/dev/null || echo 'version unknown')"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Start the wp-env test environment
        run: npx wp-env start

      - name: Run the unit test suite
        run: npm run test:unit

      - name: Stop wp-env
        if: always()
        continue-on-error: true
        run: npx wp-env stop

  e2e:
    name: End-to-end tests
    runs-on: kalle-works-arm64
    needs: [lint, test]
    # Full browser + mock-service suite is slow to justify on every PR push;
    # runs once things have already merged to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Same reason as the test job's identical setting — see there.
      WP_ENV_HOME: ${{ github.workspace }}/.wp-env-home
    steps:
      - name: Check Docker availability
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::'docker info' failed — no Docker daemon available on this runner. wp-env (and therefore this whole job) needs Docker. If this runner is Kubernetes-hosted, it needs Docker-in-Docker or a Docker socket mounted before this job can run at all."
            exit 1
          fi
          echo "Docker is available: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'version unknown')"
          if ! docker compose version > /dev/null 2>&1; then
            echo "::error::'docker compose version' failed — the Docker daemon is reachable, but the Compose v2 plugin isn't. wp-env (@wordpress/env ^11) requires 'docker compose', not the old standalone 'docker-compose' binary. Install the compose-plugin package on this runner (e.g. 'docker-compose-plugin' via apt, or the Docker Desktop/Colima setting that enables it) before this job can run."
            exit 1
          fi
          echo "Docker Compose is available: $(docker compose version --short 2>/dev/null || echo 'version unknown')"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Start wp-env
        run: npx wp-env start

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop wp-env
        if: always()
        continue-on-error: true
        run: npx wp-env stop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS
    runs-on: kalle-works-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Lint PHP syntax
        run: find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPCS
        run: composer run lint

  test:
    name: PHPUnit
    runs-on: kalle-works-arm64
    steps:
      - name: Check Docker availability
        # wp-env needs a Docker daemon; the runner naming (kalle-works-arm64)
        # suggests these may be Kubernetes-hosted, where that's not a given.
        # Fail here with a clear message rather than several minutes into a
        # cryptic wp-env timeout below.
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::'docker info' failed — no Docker daemon available on this runner. wp-env (and therefore this whole job) needs Docker. If this runner is Kubernetes-hosted, it needs Docker-in-Docker or a Docker socket mounted before this job can run at all."
            exit 1
          fi
          echo "Docker is available: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'version unknown')"
          if ! docker compose version > /dev/null 2>&1; then
            echo "::error::'docker compose version' failed — the Docker daemon is reachable, but the Compose v2 plugin isn't. wp-env (@wordpress/env ^11) requires 'docker compose', not the old standalone 'docker-compose' binary. Install the compose-plugin package on this runner (e.g. 'docker-compose-plugin' via apt, or the Docker Desktop/Colima setting that enables it) before this job can run."
            exit 1
          fi
          echo "Docker Compose is available: $(docker compose version --short 2>/dev/null || echo 'version unknown')"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Diagnose network reachability wp-env depends on
        # @wordpress/env only performs first-time provisioning (WordPress
        # core, dbDelta, and — the one this job actually needs —
        # downloading the WordPress-develop PHPUnit test library from
        # GitHub) when its own internal canAccessWPORG() check succeeds;
        # that check is *specifically* a DNS resolution of the literal
        # hostname "WordPress.org", not a check of whatever it's actually
        # about to download from (Docker Hub for images, GitHub for the
        # PHPUnit suite). If those are reachable but WordPress.org's DNS
        # specifically isn't, wp-env silently skips ALL provisioning and
        # starts from empty/unconfigured volumes — which looks exactly
        # like "wp-env start succeeded" while leaving
        # /wordpress-phpunit empty. Compare all three explicitly.
        run: |
          for host in WordPress.org github.com hub.docker.com; do
            echo "--- DNS resolution for ${host} ---"
            getent hosts "$host" || echo "FAILED to resolve ${host}"
          done

      - name: Start the wp-env test environment
        run: npx wp-env start --debug

      - name: Show whether the PHPUnit test library was actually provisioned
        # First pass showed the SimpleGit clone/sparse-checkout/fetch/
        # checkout steps all reporting success, yet the container's
        # /wordpress-phpunit only had wp-tests-config.php (written
        # separately, later, by configureWordPress()) — none of the
        # actual tests/phpunit/includes content the checkout should have
        # produced. This inspects the HOST side of that same checkout
        # directly (not just what the container's bind mount shows) to
        # see whether the working tree is genuinely empty there too, or
        # whether this is a mount-visibility problem instead.
        if: always()
        run: |
          echo "--- WP_ENV_HOME cache dir ---"
          ls -la "${HOME}/.wp-env" 2>&1 || echo "no ~/.wp-env directory at all"
          CACHE_DIR="$(find "${HOME}/.wp-env" -maxdepth 1 -type d -name 'wp-env-*' | head -1)"
          echo "Resolved cache dir: ${CACHE_DIR}"
          echo "--- host-side tests-WordPress-PHPUnit checkout, full tree (depth 3) ---"
          find "${CACHE_DIR}/tests-WordPress-PHPUnit" -maxdepth 3 2>&1 || echo "directory does not exist"
          echo "--- git state of that checkout ---"
          git -C "${CACHE_DIR}/tests-WordPress-PHPUnit" status 2>&1 || echo "not a git repo / git status failed"
          git -C "${CACHE_DIR}/tests-WordPress-PHPUnit" sparse-checkout list 2>&1 || echo "sparse-checkout list failed"
          git -C "${CACHE_DIR}/tests-WordPress-PHPUnit" log --oneline -3 2>&1 || echo "git log failed"
          git -C "${CACHE_DIR}/tests-WordPress-PHPUnit" --version
          echo "--- inside the tests-cli container ---"
          docker exec "$(docker ps --filter name=tests-cli --format '{{.Names}}' | head -1)" sh -c 'echo WP_TESTS_DIR=$WP_TESTS_DIR; ls -la /wordpress-phpunit 2>&1' || echo "could not exec into a tests-cli container"

      - name: Run the unit test suite
        run: npm run test:unit

      - name: Stop wp-env
        if: always()
        continue-on-error: true
        run: npx wp-env stop

  e2e:
    name: End-to-end tests
    runs-on: kalle-works-arm64
    needs: [lint, test]
    # Full browser + mock-service suite is slow to justify on every PR push;
    # runs once things have already merged to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check Docker availability
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::'docker info' failed — no Docker daemon available on this runner. wp-env (and therefore this whole job) needs Docker. If this runner is Kubernetes-hosted, it needs Docker-in-Docker or a Docker socket mounted before this job can run at all."
            exit 1
          fi
          echo "Docker is available: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo 'version unknown')"
          if ! docker compose version > /dev/null 2>&1; then
            echo "::error::'docker compose version' failed — the Docker daemon is reachable, but the Compose v2 plugin isn't. wp-env (@wordpress/env ^11) requires 'docker compose', not the old standalone 'docker-compose' binary. Install the compose-plugin package on this runner (e.g. 'docker-compose-plugin' via apt, or the Docker Desktop/Colima setting that enables it) before this job can run."
            exit 1
          fi
          echo "Docker Compose is available: $(docker compose version --short 2>/dev/null || echo 'version unknown')"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Start wp-env
        run: npx wp-env start

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop wp-env
        if: always()
        continue-on-error: true
        run: npx wp-env stop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHPCS
    runs-on: kalle-works-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Lint PHP syntax
        run: find . \( -path ./vendor -o -path ./node_modules \) -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPCS
        run: composer run lint

  test:
    name: PHPUnit
    runs-on: kalle-works-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Start the wp-env test environment
        run: npx wp-env start

      - name: Run the unit test suite
        run: npm run test:unit

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

  e2e:
    name: End-to-end tests
    runs-on: kalle-works-arm64
    needs: [lint, test]
    # Full browser + mock-service suite is slow to justify on every PR push;
    # runs once things have already merged to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install PHP dependencies
        run: composer install --no-interaction

      - name: Start wp-env
        run: npx wp-env start

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: kalle-works-arm64
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install semantic-release
        run: npm install --no-save --no-audit --no-fund semantic-release@^25 @semantic-release/git@^11 @semantic-release/changelog@^7 @semantic-release/exec@^7 conventional-changelog-conventionalcommits@^10

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
          if [ -f .next-version ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish-wordpress-org:
    name: Build, verify, and deploy to WordPress.org
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: kalle-works-arm64
    permissions:
      contents: write
    env:
      SLUG: euromail
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release job just pushed a version-bump commit and tag to
          # main; check that out, not whatever ref triggered this workflow.
          ref: main
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install PHP dependencies (production only, optimized autoloader)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Assemble the distributable plugin directory
        run: |
          mkdir -p build
          rsync -a --exclude-from=.distignore ./ build/

      - name: Build a zip named the way a real install expects (top-level folder = slug)
        run: |
          mkdir -p "pkg/${SLUG}"
          rsync -a build/ "pkg/${SLUG}/"
          ( cd pkg && zip -rq "../${SLUG}-${VERSION}.zip" "${SLUG}" -x '.*' )

      - name: Verify the zip installs and activates cleanly on a fresh WordPress site
        run: bash bin/verify-zip-install.sh "${SLUG}-${VERSION}.zip"

      - name: Upload the verified zip to the GitHub release
        # Runs regardless of whether the SVN deploy step below can succeed
        # yet, so every release always gets a downloadable, verified zip
        # attached — not contingent on the one-time WordPress.org
        # submission having happened already.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" "${SLUG}-${VERSION}.zip" --clobber --repo "${{ github.repository }}"

      - name: Deploy build/ to the WordPress.org plugin SVN repository
        # This requires the "euromail" slug to already exist on
        # WordPress.org (i.e. the one-time plugin submission and review has
        # already been completed manually) — it will fail on every run
        # before that, which is expected until then.
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: build
